# content boundary (owner's standing rule): never in any story
boundary: [blood, bleed, bleeding, bloody, concuss, concussion, brain, fracture, broken nose, broken jaw, unconscious for,
           seizure, hospital, stretcher, coma, slur]
# Rotating bans: each brief also forbids a few of these ordinary crutches, so no two stories
# lean on the same connective tissue.
crutch: [suddenly, slowly, finally, just, almost, really, quiet, silence, stare, glare, smile, laugh, nod, shrug,
         breath, eyes, hands, looked, turned, felt, knew, remember, always, never, "as if", "like a", cold, hot,
         heavy, small, voice, room, moment, second, step, still, back, face, name, word]

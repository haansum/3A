  line: You're going to ask for a rematch on a podcast. I'm going to say 'who?' on a bigger podcast.
- when: after
  tone: underground
  ctx: the students
  line: Your students are going to be real nice to you Monday. Like, weird nice. That's how you'll know.
- when: after
  tone: underground
  ctx: the highlight reel
  line: You're in my highlight reel now. First clip. You always wanted to open for me.
inventory:
- when: before
  tone: measured
  ctx: one now trains under the other's former coach
  line: The coach is mine, he just hasn't told you. The jab is mine, I can show you tape. The nickname you got off a T-shirt. So what did you actually bring?
- when: before
  tone: measured
  ctx: she took the old gym's neon sign when it closed
  line: That sign in your window belongs to a gym that closed. The bag under it has my tape on it. Even the fan is ours. You opened a museum of us and hung your own picture in it.
- when: after
  tone: measured

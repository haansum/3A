crowd_work:
- when: before
  tone: measured
  ctx: hometown gate
  line: Who drove in from her town? Hands up. Good. You four can carpool home early.
- when: before
  tone: measured
  ctx: a year of posts and replies, first time in the same room
  line: Don't boo her, she can't hear you, she's been listening to her own interviews. Somebody wave so she knows which way the cage is.
- when: after
  tone: measured
  ctx: hometown gate
  line: Her town, where are you? Make some noise. No? Nothing? You were so loud at the weigh-in.
- when: after
  tone: measured
  ctx: a year of posts and replies
  line: Everybody who typed at me this year, stand up. Go on. I can see you sitting. I've got your usernames.
- when: after
  tone: measured
  ctx: the other's students in the cheap seats
  line: Kids in the green shirts. Up the back. That's your teacher. Wave. She'd want you to see this bit.
- when: after
  tone: measured
  ctx: debut in front of everyone she grew up with
  line: Who taught her at school? Is her teacher in? You should've held her back a year.
- when: after
  tone: measured
  ctx: she moved away and came back
  line: Who paid forty dollars to watch her come home? Hands. Right. See me after, I'll sign something. It won't be a refund.
- when: after
  tone: measured
  ctx: the twin gyms
  line: Everybody from the gym across the road, there's a door behind you marked exit. Classes at mine start Monday.
- when: after
  tone: measured
  ctx: the promoter's favourite
  line: Who's got the poster? Hold it up. Higher. There she is. Now look down here. Spot the difference.
- when: after
  tone: measured
  ctx: she called the other boring
  line: Was that boring? Row one, was that boring? You, in the hat. Were you bored?
- when: after
  tone: measured
  ctx: late replacement
  line: Give it up for the replacement, everybody. She said yes on a Tuesday. That's more notice than she gave the canvas.
- when: after
  tone: measured
  ctx: the bet
  line: Who had her in two? Anyone? Who had me in one? You, sir, drinks are on you. They're on her, really.
- when: after
  tone: measured
  ctx: the walkout song
  line: Sing it. You all know it. It's my song, she just borrowed it. From the top. She'll come in when she's ready.
- when: after
  tone: underground
  ctx: her section
  line: Section C! Y'all came deep! Y'all brought SIGNS! Hold the signs up. I want to read them to her later.
- when: after
  tone: underground
  ctx: phones out
  line: Everybody filming, keep filming. Get the toes. Don't miss the toes.
- when: after
  tone: underground
  ctx: the bet
  line: Who bet on her? Be honest. You, in the puffer jacket. I see you sweating in a puffer jacket.
- when: after
  tone: underground
  ctx: her students
  line: Green shirts! Up top! Your coach'll be with you shortly. She's just reviewing the floor plan.
- when: after
  tone: underground
  ctx: the chant
  line: Start her chant again. Go on. 'Let's go' what? I can't hear you. Neither can she.
nostalgia:
- when: before
  tone: measured
  ctx: shared an apartment during the lean years; one moved out owing
  line: We split one space heater in that apartment. You'd turn it to your side when you thought I was asleep. I was never asleep. That's all tonight is.
- when: before
  tone: measured
  ctx: she kept the dog when the apartment split
  line: He used to sleep on your gym bag. He cries at the door the week you fight. I let him watch. I want him to see how it goes for people who leave.
- when: after
  tone: measured
  ctx: shared an apartment during the lean years
  line: Remember the flat? One heater. You'd say 'I'm not cold' and take it anyway. You look warm enough now.
- when: after
  tone: measured
  ctx: she kept the dog
  line: He'll be at the door when you get home. He always knew when one of us had lost. He'd bring a shoe. Tell him I said hello.
- when: after
  tone: underground
  ctx: same town
  line: same bus
- when: after
  tone: measured
  ctx: the amateur final at seventeen
  line: Eleven people watched us the first time. Your dad, my mum, a caretaker with a mop. I liked that fight better. You were still trying to beat me then.
- when: after
  tone: measured
  ctx: roommates at national camp
  line: They put us in room nine. You asked to move before breakfast. I had the whole room for two weeks. It was the best camp I ever had. So thanks.
- when: after
  tone: measured
  ctx: the old coach
  line: He used to make us hold hands and bow after sparring. Remember? You always squeezed too hard. Give me your hand. No? Later, then.
- when: after
  tone: measured
  ctx: the borrowed gloves
  line: You lent me those gloves on my first day because mine were too big. That was a kind thing. I keep trying to think of another one.
- when: after
  tone: measured
  ctx: the neon sign
  line: That sign used to buzz when it rained. We'd count the seconds between flickers. I counted tonight, too. Out of habit. I got to four.
- when: after
  tone: measured
  ctx: penpals as teenagers
  line: You wrote me thirty-one letters. You drew a little glove by your name. I've still got them. I'll send them back, shall I? You can read how nice you were.
- when: after
  tone: measured
  ctx: cousins
  line: Nan had our school photos side by side on the piano. Yours a bit in front. I went round this morning and swapped them.
- when: after
  tone: measured
  ctx: the kids' class they both taught
  line: We taught the six-year-olds together. You did the falling-down game. Arms in, chin tucked, roll. You were so good at that game.
accountant:
- when: before
  tone: measured
  ctx: the purse gap
  line: They pay you eight to show and me forty. So every minute you last costs me money and makes you none. Do the arithmetic and sit down.
- when: before
  tone: measured
  ctx: ticket sales in the other's hometown
  line: I sold three hundred seats in your zip code. You sold your cousin's table. I ought to invoice you for the audience.
- when: after
  tone: measured
  ctx: the purse gap
  line: Forty to show, forty to win. You got eight. Divide eight thousand by ninety-one seconds. No, I'll do it. Eighty-eight dollars a second. Best rate you've ever had.
- when: after
  tone: measured
  ctx: ticket sales
  line: You sold six hundred seats tonight. I get a cut of the gate. So every one of your cousins paid me to be here. Tell them I said thanks.
- when: after
  tone: measured
  ctx: the unpaid loan
  line: Fifteen hundred, for the deposit, in two thousand and nineteen. I'm taking it out of tonight. Consider us square. No, we're not square. But consider it.
- when: after
  tone: measured
  ctx: the sponsor
  line: That logo on your shorts paid you two grand. It's getting ninety seconds of screen time, face down. I'd ask for some of that back, if I were them.
- when: after
  tone: measured
  ctx: she'd fight her for gas money
  line: You said gas money. It's four dollars a gallon. That was about a pint's worth.
- when: after
  tone: measured
  ctx: the rent
  line: Five hundred a month extra, thirty-one months. Fifteen and a half thousand. My win bonus is fifteen. I'm still five hundred down. I'll send a bill.
- when: after
  tone: measured
  ctx: the meal plan she sells
  line: Forty dollars a download, my plan, your name. How many did you sell? Two hundred? Eight thousand. Same as your purse. That's tidy.
- when: after
  tone: measured
  ctx: the bet
  line: You put a hundred against me once at three to one. Tonight I was three to one against. Somebody at the back just made what you made. Ask him how it feels.
- when: after
  tone: measured
  ctx: the camp rental
  line: A hundred and ninety, plus four years. I don't charge interest. I charge this.
- when: after
  tone: measured
  ctx: the last fight on a deal
  line: This was the last one on your contract. So the cost per fight, for them, just went up. I wouldn't expect a call.
- when: after
  tone: measured
  ctx: the auctioned gloves
  line: You got three hundred for my gloves. I got sixty thousand for tonight. One of us understands what things are worth.
- when: after
  tone: underground
  ctx: the purse
  line: They paid you eight grand. For that. I want to work where you work.
- when: after
  tone: underground
  ctx: ticket sales
  line: Your whole family bought tickets. Thank them for me. They paid for my car.
- when: after
  tone: underground
  ctx: the loan
  line: Fifteen hundred you owed me. Keep it. Buy a chin.
- when: after
  tone: underground
  ctx: per second
  line: Eighty-eight dollars a second. Best money you'll ever make lying down. Don't say anything, I heard it too.
- when: after
  tone: underground
  ctx: the sponsor
  line: Your sponsor paid for that patch on your shorts. It's on the floor now. Great placement. Real eye level.
whisper:
- when: before
  tone: measured
  ctx: she still fights in gloves she borrowed and never returned
  line: (A handshake for the cameras. Under it, lips barely moving:) I kept your gloves because they fit me better.
- when: before
  tone: measured
  ctx: she refused a handshake in front of the other's students
  line: (At the staredown, pleasantly:) Smile. Your students are watching you be afraid.
- when: after
  tone: measured
  ctx: she still fights in borrowed gloves
  line: (Bending as if to check on her, for the cameras; lips hardly moving:) They never fit you.
- when: after
  tone: measured
  ctx: she refused a handshake in front of students
  line: (Helping her to sit, an arm round her shoulders, smiling at the crowd:) They're all watching. Shake my hand or I let go.
- when: after
  tone: measured
  ctx: she left before the title fight
  line: (Into her ear, as the doctor steps back:) Three weeks early. You always did leave early.
- when: after
  tone: measured
  ctx: the sparring story
  line: (Arm raised by the referee, eyes on the far corner; from the side of her mouth:) Tell them I slipped.
- when: after
  tone: measured
  ctx: the memorial
  line: (Touching gloves to the fallen one's shoulder, a gesture the broadcast calls classy:) He asked where you were.
- when: after
  tone: measured
  ctx: the trademark
  line: (Kneeling, a hand flat on the canvas beside her head:) You can have the name. I've stopped wanting it.
- when: after
  tone: measured
  ctx: the kid
  line: (As the second arrives, without looking at him:) Tell Sana I'll see her Monday.
- when: after
  tone: measured
  ctx: the wedding seat
  line: (Leaning in as if to say well fought:) Can you see all right from there?
- when: after
  tone: measured
  ctx: the locks
  line: (Low, as they lift her to the stool:) I've still got a key.
- when: after
  tone: measured
  ctx: the reference
  line: (Through a smile, hugging the loser's coach:) I know what she told Brennan about me. So does Brennan.
- when: after
  tone: underground
  ctx: handshake for cameras
  line: (Smiling, arm round her, through her teeth:) Say 'good fight' so they clap. Say it or I do the dance.
- when: after
  tone: underground
  ctx: the gloves
  line: (Leaning down like she's checking on her:) Still my gloves. Still don't fit you.
- when: after
  tone: underground
  ctx: the kid
  line: (Hugging the loser's coach, sweet as anything:) Tell Sana Monday. Six a.m. Tell her bring her own tape this time.
- when: after
  tone: underground
  ctx: the key
  line: (Close, as they lift her:) I never gave the key back. I go in sometimes. I move your stuff an inch.
wounded:
- when: before
  tone: measured
  ctx: she thanked forty people after her title win and left out one
  line: Forty names. I counted them on the replay, twice, in case I'd missed mine. You thanked the man who drives the ring truck.
- when: before
  tone: measured
  ctx: she told the sparring story as a toast at the other's wedding
  line: You told that story at my wedding. With a glass in your hand. My father laughed, and he has never once laughed at anything I did on purpose.
- when: after
  tone: measured
  ctx: she thanked forty people and left out one
  line: Say my name. That's all I wanted. One time, with the belt on. You had ninety seconds and you gave it to a truck driver.
- when: after
  tone: measured
  ctx: she told the story at the wedding
  line: My father laughed at that toast. I watched him. I've wanted to put you on your back in front of him ever since, and he couldn't come tonight.
- when: after
  tone: measured
  ctx: she did not come to the memorial
  line: He asked for you. On the Tuesday. I told him you were on your way. I've hated you since the Tuesday, not the funeral.
- when: after
  tone: measured
  ctx: she left without a word
  line: You didn't even leave a note. Eight years, and I found out from the locker. I'd have done this years ago if you'd just left a note.
- when: after
  tone: measured
  ctx: she painted the other out of the mural
  line: I went past and saw the blue square where my face was. I stood there so long a kid asked if I was lost.
- when: after
  tone: measured
  ctx: she unfollowed the night of the other's worst loss
  line: The night I lost in Leeds I looked at my phone in the ambulance bay to see if you'd written. You'd unfollowed. That was all. That was the whole message.
- when: after
  tone: measured
  ctx: she left the message on read
  line: Three years on read. I checked it this morning. Still two ticks. You could have typed one letter.
- when: after
  tone: measured
  ctx: she pulled her daughter out of the kids' class
  line: She was my best one. Five years old, never missed a Saturday. You took her out and didn't tell me why. I kept her gloves on the hook.
- when: after
  tone: measured
  ctx: she walked out with the old sponsor taped over
  line: You taped over my dad's shop on your shirt. With grey tape. He saw it on television. He rang me to ask what he'd done.
- when: after
  tone: measured
  ctx: the favour never returned
  line: I drove six hours to hold your bucket in Hull. Six. You didn't come to one of mine. Not one. I looked for you in the seats every time.
- when: after
  tone: underground
  ctx: left out of the speech
  line: You thanked your DOG. On stage. Before me. Your dog wasn't in camp.
- when: after
  tone: underground
  ctx: left on read
  line: I texted you 'you good?' when your mom was sick. Nothing. So no, I'm not asking if you're good now.
- when: after
  tone: underground
  ctx: the mural
  line: You painted over my face with the cheap paint. You can still see my ears through it. Like I'm drowning in a wall.
- when: after
  tone: underground
  ctx: the unfollow
  line: You unfollowed me the night I lost. I noticed. I notice everything. I noticed your left hand come down too.
- when: after
  tone: underground
  ctx: no note
  line: Eight years and you left like a roommate who owes rent. I'd have helped you move. I'd have carried the boxes.
auctioneer:
- when: after

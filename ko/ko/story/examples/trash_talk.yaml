# Trash-talk bank. Technique examples, grouped by register.
#   when:  before = said before the fight; after = said over the result (rubbing it in)
#   tone:  measured = cold, exact, grown-up; underground = young, fast, funny-cruel, the voice of an
#          unsanctioned circuit: sharper than a street clip caption, looser than a broadcast
#   ctx:   the invented history or the visible detail the line is built on
# These teach how a line is BUILT. Never reuse a line, a sentence shape or an object from here:
# the lint counts every line in this file as already-used text.
ledger:
- when: before
  tone: measured
  ctx: she left the gym three weeks before the team's first title fight
  line: March ninth you cleaned out locker fourteen. March thirtieth we fought for the belt with a kid holding the bucket. I'm not angry. I'm reading you the calendar.
- when: before
  tone: measured
  ctx: she never paid her share of a training camp rental
  line: Eleven hundred and forty dollars, split six ways, and five of us paid. I kept the receipt in my gear bag three years so I'd have something to hand you tonight.
- when: after
  tone: measured
  ctx: she left the gym three weeks before the title fight
  line: Twenty-one days. That's how early you left. Tonight took one minute and nine seconds. I've now spent less time on you than you spent on your notice.
- when: after
  tone: measured
  ctx: she never paid her share of a camp rental
  line: One hundred and ninety dollars. I wrote it on my wrist tape tonight, under the glove. You can read it when they cut it off.
- when: after
  tone: measured
  ctx: she missed weight for their first booking and kept half the purse
  line: You were two and a quarter pounds over in Tulsa and kept eleven thousand. Tonight you made weight. I wanted that noted somewhere, so I noted it.
- when: after
  tone: measured
  ctx: she drove the team van home and left the rest at the venue
  line: Four hundred and twelve miles. Six of us on a bench outside a closed arena. I counted mile markers on the bus. I've just finished counting.
- when: after
  tone: measured
  ctx: their first fight was a draw and she celebrated like a win
  line: First fight, three cards, one of them even. This one has no cards. I'd like the record to show I asked for less paperwork.
- when: after
  tone: measured
  ctx: she changed the gym locks while the other was away
  line: The locksmith's invoice was dated the fourteenth. I fought on the fifteenth. I kept the old key. It opens nothing. Neither do you, now.
- when: after
  tone: measured
  ctx: she borrowed the other's car for a weigh-in and returned it empty
  line: Quarter tank when you took it. Empty when it came back. Odometer up eighty-eight miles. I'm telling you the numbers because you only ever respected numbers.
- when: after
  tone: measured
  ctx: she sold the other used shin guards as new
  line: Sixty-five dollars, cash, in the car park, March. The strap was already stitched twice. I wore them tonight. That's what hit you.
- when: after
  tone: measured
  ctx: she raised the gym's rent the month the other turned professional
  line: Rent went from nine hundred to fourteen hundred the week I signed. That's five hundred a month for thirty-one months. Somebody check my adding. She can't just now.
- when: after
  tone: measured
  ctx: she posted the scorecards from their fight every year on the anniversary
  line: Four anniversaries. Four posts. Twenty-nine, twenty-eight. You'll have something new to put up next year. Round one, two minutes and six.
- when: after
  tone: measured
  ctx: she took a deposit to teach a seminar and did not turn up
  line: Thirty kids paid twenty dollars each to see you. Two o'clock, a Saturday. I taught it for you. I've taught this one for you as well.
- when: after
  tone: measured
  ctx: she thanked forty people after her title win and left out one
  line: Forty names in ninety seconds. I timed the clip. Tonight you got eighty-one seconds, and I only needed the one name.
- when: after
  tone: underground
  ctx: unpaid camp fee
  line: A hundred and ninety. That's what you owed. I'd say we're even but I'm not good at math and I'm feeling greedy.
- when: after
  tone: underground
  ctx: she left three weeks before the title fight
  line: Three weeks early you left. Tonight you left early again. At least you're consistent.
- when: after
  tone: underground
  ctx: the van
  line: Four hundred miles I rode a bus because of you. You just went four feet. Straight down. Feels about fair.
- when: after
  tone: underground
  ctx: the rent
  line: You raised my rent five hundred. I just lowered your whole property value.
- when: after
  tone: underground
  ctx: she missed weight and kept the purse
  line: You missed weight by two pounds in Tulsa. Tonight you made weight and missed everything else.
kindness:
- when: before
  tone: measured
  ctx: the veteran everyone must beat
  line: 'Nobody will say it to you, so I will, because I like you: they book you because you lose well. You make people look good. That''s a real skill. Go home and be proud of it.'
- when: before
  tone: measured
  ctx: a debut in front of everyone she grew up with
  line: Your mother is in row two. I saw her. I'm going to try to make it quick, for her, and if it isn't quick I want you to know that part was you.
- when: after
  tone: measured
  ctx: the veteran everyone must beat
  line: Don't get up for me. Really. You've been getting up for other people's careers for nine years. Have this one lying down.
- when: after
  tone: measured
  ctx: a debut in front of everyone she grew up with
  line: They all came. Look how many. That's a lovely thing, to have that many people see you try. Somebody tell her that when she can hear it.
- when: after
  tone: measured
  ctx: she claimed to be self-taught
  line: It's all right. Nobody teaches that part. I'd have shown you, if you'd stayed. I'd have shown you everything. That's the sad bit.
- when: after
  tone: measured
  ctx: she recruited the other's best young student
  line: Tell the girl she can come back. I mean it. I'm not angry with her. She was sixteen and somebody promised her things. I know the somebody.
- when: after
  tone: measured
  ctx: the last fight on a deal that will not be renewed
  line: I asked them to keep you on the roster. I did. I said she's good for the young ones to learn against. They said they'd think about it.
- when: after
  tone: measured
  ctx: she told the sparring story as a toast at the wedding
  line: Easy. Easy. Give her room. She told a story about me once at a nice occasion. I'd hate for anyone to tell one about her at this one.
- when: after
  tone: measured
  ctx: she called the other 'a good first test'
  line: You were right, you know. You were a good first test. I learned a lot. I'm grateful. I'd say it to your face but it's pointed the other way.
- when: after
  tone: measured
  ctx: she got the ranking spot by fighting once that year
  line: You rest. You've earned a rest, one fight a year is hard on a person. Take next year too.
- when: after
  tone: measured
  ctx: one taught the other; the student got the bigger contract
  line: You did well, kid. Better than I thought. That's not nothing, coming from me. Stay down a second and let it be a compliment.
- when: after
  tone: measured
  ctx: she said she would rather fight anyone with a pulse
  line: Shh. It's fine. You asked for anyone, and they sent you someone. That's the system working. Nobody's fault.
- when: after
  tone: measured
  ctx: she moved away and came back selling more tickets in the other's town
  line: You brought so many people home with you. I want to thank them for coming. It's a long drive back. Somebody see they get coffee.
- when: after
  tone: underground
  ctx: debut at home
  line: Aw. No, don't get up, your mom's filming. Let her get the good angle.
- when: after
  tone: underground
  ctx: the gatekeeper
  line: You did so good. You did. You lasted way longer than I told people you would. I said thirty seconds.
- when: after
  tone: underground
  ctx: a good first test
  line: It's okay. Some tests you just don't study for.
- when: after
  tone: underground
  ctx: the kid
  line: Tell the kid it's not her fault she picked wrong. She's sixteen. You're thirty-one. What's your excuse?
- when: after
  tone: underground
  ctx: late replacement
  line: Thanks for coming, though. For real. Somebody had to.
comedian:

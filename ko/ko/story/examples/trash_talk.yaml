  ctx: the poster
  line: She's on the poster looking tough. Somebody Photoshop the eyes. Make 'em match.
- when: after
  tone: underground
  ctx: reunion tour
  line: Reunion tour's cancelled. Refunds at point of purchase. Which is her face.
- when: after
  tone: underground
  ctx: the trademark
  line: She trademarked my name. Okay. Trademark that.
- when: after

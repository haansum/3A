- when: after
  tone: measured
  ctx: she bet against the other and collected
  line: Somebody in row four just lost money on you. He'll find you later to be decent about it. That's the part you'll remember.
- when: after
  tone: measured
  ctx: she posted the scorecards every year
  line: A year from tonight I'll post a clock. Just the clock. No caption. You'll know the minute before you open it.
- when: after
  tone: measured
  ctx: she laughed on a podcast at an impression of the other
  line: Someone will do an impression of this. Soon. On a show. And the host will laugh, once, the way you did, and you'll hear exactly how it sounds.
- when: after
  tone: underground
  ctx: the internet
  line: By midnight this is a GIF. By Monday it's a reaction. Somebody's going to send you yourself when their order's late.
- when: after
  tone: underground
  ctx: her gym
  line: Tomorrow your gym's got a 'we're proud of you' post up. Comments off.
- when: after
  tone: underground

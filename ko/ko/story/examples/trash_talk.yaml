  tone: measured
  ctx: she left before the title fight
  line: You'll tell this as the night you were unlucky. You'll tell it at the new gym, to people who weren't here. One of them will have seen the tape.
- when: after
  tone: measured
  ctx: a debut in front of everyone she grew up with
  line: They'll be kind in the car park. They'll say next time. Your uncle will say the ref was quick. You'll let him.
- when: after
  tone: measured
  ctx: she recruited the other's best young student

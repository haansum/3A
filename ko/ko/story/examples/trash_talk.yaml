prophecy:
- when: before
  tone: measured
  ctx: their first fight ended in under a minute
  line: You'll come out fast because they told you to. You'll feel good for about a minute. Then you'll check your corner, and I'm telling you now which look you'll get.
- when: before
  tone: measured
  ctx: the last fight on a deal that will not be renewed
  line: Monday your manager calls and he's gentle about it. Tuesday the gym takes your picture off the website. I'm only the Saturday part.
- when: after
  tone: measured
  ctx: their first fight ended in under a minute
  line: In about a minute you'll ask your corner what happened. He'll say a name. It'll be mine. You'll ask again.
- when: after
  tone: measured
  ctx: the last fight on a deal that will not be renewed
  line: Tomorrow there's an email. Short. They thank you. Thursday your locker has somebody else's tape on it. By spring you're a question at a pub quiz.

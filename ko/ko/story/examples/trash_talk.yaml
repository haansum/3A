host:
- when: before
  tone: measured
  ctx: she moved away, came back, and sells more tickets in the other's town
  line: Welcome home. Take the locker room on the left, it's the nice one. Towels are mine, water's mine, crowd's mine. Anything you need tonight, ask me, because everything here does.
- when: before
  tone: measured
  ctx: one used to work the front desk at the other's gym
  line: You used to hand me my key card. Tonight I got you a pass. The lanyard suits you. Some people are built for a lanyard.
- when: after
  tone: measured
  ctx: she moved away and came back selling more tickets
  line: Stay as long as you like. The building's mine till eleven. Someone bring her water, the good water, from my room.
- when: after
  tone: measured
  ctx: one used to work the front desk at the other's gym
  line: Let me get the door for you on the way out. I've always been good at the door. You used to say so.
- when: after
  tone: measured
  ctx: hometown gate
  line: Welcome to the canvas. I had it repainted this week. That's my sponsor you're lying on. Mind the logo, it's still tacky.
- when: after
  tone: measured
  ctx: she had the other seated by the kitchen at her wedding
  line: We've put you right at the front tonight. Best view in the house. I didn't want you to feel you'd been stuck at the back.
- when: after
  tone: measured
  ctx: the twin gyms on one street
  line: You came across the street for this. Twenty yards. I'd have saved you the walk, but it's nicer in my building.
- when: after
  tone: measured
  ctx: she no-showed a seminar
  line: I've kept your slot open. Two o'clock, Saturday, thirty kids. You can do it sitting down. They'd like to meet you.
- when: after
  tone: measured
  ctx: she borrowed the car
  line: I'll have someone drive you. My car. It's got a full tank. I'll want it back that way.
- when: after
  tone: measured
  ctx: late-notice replacement
  line: Thank you for coming at such short notice. We do appreciate it. There's a little something for you at the desk. It's the bus fare.
- when: after
  tone: measured
  ctx: she changed the locks
  line: Take your time getting up. Nobody's going to lock you out. That's not how we do things here.
- when: after
  tone: measured
  ctx: she took the sponsor
  line: That's my sponsor's name under your shoulder. Read it to me. I pay good money for that placement and I like to hear it.
teacher:
- when: before
  tone: measured
  ctx: she wins with a combination the other drilled into her
  line: Your left comes home low. Every time. I'm telling you now so afterward you can't say nobody taught you anything.
- when: before
  tone: measured
  ctx: one taught the other; the student got the bigger contract
  line: Lesson one was stance and you were late. Lesson two was respect and you were sick. Tonight is the make-up class.
- when: after
  tone: measured
  ctx: she wins with a combination the other drilled into her
  line: Hands. I told you about the hands in two thousand and sixteen. I told you every Tuesday. That was the last time I'll tell you.
- when: after
  tone: measured
  ctx: one taught the other; the student got the bigger contract
  line: Right. Where did it go wrong? Anyone? She dropped the rear hand to look. What do we never do? We never look.
- when: after
  tone: measured
  ctx: she claims to be self-taught
  line: Class, this is what self-taught looks like. Note the feet. Nobody ever corrected the feet. Thank you, you can stay there.
- when: after
  tone: measured
  ctx: she stole the drill
  line: You teach my drill wrong, by the way. You skip the pivot. I saw the video. That, just now, was the pivot.
- when: after
  tone: measured
  ctx: the understudy
  line: Three years you held the bag for me. You were supposed to be watching. That's what holding the bag is for.
- when: after
  tone: measured
  ctx: student of a student
  line: I taught the woman who taught you. So think of this as a grandmother coming round to check your homework.
- when: after
  tone: measured
  ctx: the veteran with every trick
  line: Good. Good try. You showed me the old one, the shoulder feint. I wrote that one. Next time bring something I didn't write.
- when: after
  tone: measured
  ctx: she recruited the kid
  line: Come and look, all of you. Closer. This is what I meant by chin. This is the whole lesson. Sana, are you watching? Good girl.
- when: after
  tone: measured
  ctx: she went full power in a light session two weeks before the other's biggest fight
  line: That's what full power looks like when it's the right day for it. Write down the date. You always did get the dates wrong.
- when: after
  tone: measured
  ctx: she called the other boring
  line: Boring, you said. Fundamentals are boring. Here endeth the fundamentals.
- when: after
  tone: underground
  ctx: hands down
  line: Hands. Up. I said it for four years. I said it till I hated my own voice. You want to hear it again? Me neither.
- when: after
  tone: underground
  ctx: the drill
  line: That's the drill you teach at your little seminars. That was the answer key. You've been teaching the questions.
- when: after
  tone: underground
  ctx: the class watching
  line: Everybody get your phones out, this is the lesson. This is the whole curriculum. There's no part two.
- when: after
  tone: underground
  ctx: boring fundamentals
  line: Fundamentals are boring, you said. Well. That was a jab and a cross. Day one stuff. Kids' class stuff.
- when: after
  tone: underground
  ctx: the understudy
  line: You held pads for me for three years and learned nothing. That's actually impressive. That takes effort.
bored:
- when: before
  tone: measured
  ctx: the promoter's favourite and the early weigh-in slot
  line: Sorry, which one is she? No, I can hear that she's talking. I meant on the poster.
- when: before
  tone: measured
  ctx: a ranking spot and nothing else
  line: I have physio at four and this at nine. Honestly the four worries me more.
- when: after
  tone: measured
  ctx: the promoter's favourite
  line: Is that it? I had a whole second round planned. I'd stretched for it and everything.
- when: after
  tone: measured
  ctx: a ranking spot and nothing else
  line: Somebody wake me when they've read it out. Not her. Me.
- when: after
  tone: measured
  ctx: a year of posts and replies
  line: All that typing. I thought there'd be more to you in person. Can I go? Is there a form?
- when: after
  tone: measured
  ctx: late-notice replacement
  line: Who's next? No, really. I'm still warm. Has anyone got a sister?
- when: after
  tone: measured
  ctx: she called the other 'a good first test'
  line: I've had harder warm-ups. I had a harder warm-up tonight. Ask Dele, he's got the pad bruises.
- when: after
  tone: measured
  ctx: the gatekeeper
  line: What time is it? I told my mother I'd ring by ten. Oh. Loads of time.
- when: after
  tone: measured
  ctx: she said she'd fight her for gas money
  line: Did we get the whole purse for that? For that? I feel like I should give some of it back. I won't.
- when: after
  tone: measured
  ctx: the twin gyms
  line: They told me she was the best one across the road. I'd hate to see the rest. Actually, send them over. I've a free Thursday.
- when: after
  tone: measured
  ctx: rematch after a robbed decision
  line: I trained twelve weeks for the judges. Twelve weeks. And she didn't even let it get to them. Rude.
- when: after
  tone: measured
  ctx: she bet against the other
  line: I'd say I'm surprised. I'm not even surprised. Somebody be surprised for me, I haven't the energy.
- when: after
  tone: underground
  ctx: short fight
  line: That's it? I did my hair for this.
- when: after
  tone: underground
  ctx: after the wave-off
  line: Somebody get me my phone. No, I'm not posting. I'm checking what else is on.
- when: after
  tone: underground
  ctx: the gas money line
  line: I've had Uber rides longer than that. I tipped better too.
- when: after
  tone: underground
  ctx: the twin gyms
  line: That's your best one? From across the street? Send the B team. Send whoever answers the phone.
- when: after
  tone: underground
  ctx: the trilogy
  line: They want a third one. A third one! I didn't want the second one.
confession:
- when: before
  tone: measured
  ctx: she did not come to the coach's memorial; she posted from a beach that day
  line: 'I did skip it. I was on a beach and I knew what day it was. That''s who you drew: somebody who can do that and sleep. Can you?'
- when: before
  tone: measured
  ctx: she signed the local sponsor the other had for six years
  line: I took your sponsor, yes. I called him from your own parking lot. I am not a good friend. I'm a very good fighter, and for six years you've had those two backwards.
- when: after
  tone: measured
  ctx: she did not come to the memorial
  line: I skipped his memorial. You know I did. And I'd skip it again to have this. That's the kind of person just beat you. Live with that.
- when: after
  tone: measured
  ctx: she signed the other's sponsor
  line: I took your sponsor, your cut-man and your Thursday slot. I did all of it on purpose. I'd like that understood. None of it was luck, and neither was that.
- when: after
  tone: measured
  ctx: she left before the title fight
  line: I left three weeks before your big night because I didn't think you'd win it. I was right. I didn't want to be standing next to it.
- when: after
  tone: measured
  ctx: she drove the van home
  line: I took the van. I knew you were all still inside. I had the keys in my hand for a full minute first. Then I drove. Then I slept fine.
- when: after
  tone: measured
  ctx: she sold the tape to an opponent's camp
  line: I sent them your sparring tape. Forty minutes of it. I watched it again this week. Everything on it still works.
- when: after
  tone: measured
  ctx: she went full power in a light session
  line: I hurt you on purpose in that session. Two weeks out. You were getting ahead of me and I couldn't stand it. I can stand it now.
- when: after
  tone: measured
  ctx: she registered the trademark
  line: I filed for your name the day after you beat me. Twelve dollars online. Spite, pure and simple. Best twelve dollars I ever spent, until tonight's ticket.
- when: after
  tone: measured
  ctx: she told the coach the other was leaving
  line: I told him you were going before you'd decided. I wanted him cold with you. He was. And you went. And here we both are.
- when: after
  tone: measured
  ctx: she poached the kid
  line: I took Sana from you because she's better than both of us and I wanted my name on her. Not for her sake. For mine.
- when: after
  tone: measured
  ctx: she bet against the other
  line: I bet against you, back then. With Marco. A hundred. I'd have bet against you tonight if they'd let a fighter do that.
translator_gap:
- when: before
  tone: measured
  ctx: they do not share a language; everything passes through a third person
  line: '(She says nine words. The interpreter says: "She wishes you luck." Everyone in the room who speaks the language has stopped smiling.)'
- when: before
  tone: measured
  ctx: same, at a press conference
  line: (What she said concerned the other's mother's cooking. What reached the microphone was "she respects your camp." The laugh came late, from two cousins at the back.)
- when: after
  tone: measured
  ctx: they share no language
  line: '(She speaks for some time, crouched. The interpreter, asked what was said, looks at the canvas and says: "She says good fight." Nobody who understood her is looking at anyone.)'

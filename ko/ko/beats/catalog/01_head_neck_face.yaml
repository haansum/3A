family: head_neck_face
title: Head, neck, face
levers:
  # ---- head / neck posture ----
  - {id: neck.chin_tuck, label: Chin tucks toward chest (as if looking at her knees), region: neck,
     say: [chin tuck, chin down, chin to chest, looking at her knees, head curl forward, head nods forward],
     pose: {neck_flex: [0, 38], head_flex: [0, 16]}, src: log}
  - {id: neck.chin_up, label: Chin tilts up / head thrown back, region: neck,
     say: [chin tilt up, chin up, chin lift, head tilt back, head thrown back, head arch back, neck extend, neck arch],
     pose: {neck_flex: [0, -34], head_flex: [0, -16]}, src: log}
  - {id: neck.turn, label: Head turned to one side, region: neck, side: LR, mirror: true,
     say: [head turn, face turn, head rotated, looking over shoulder, head twisted, head to the side],
     pose: {neck_twist: [0, 55]}, src: new}
  - {id: neck.tilt, label: Head tilted ear-to-shoulder, region: neck, side: LR, mirror: true,
     say: [head tilt to, ear to shoulder, head cocked, head lolls to, head leans to],
     pose: {neck_lat: [0, 30], head_lat: [0, 12]}, src: new}
  - {id: neck.rigid, label: Neck held rigid in line with the trunk, region: neck,
     say: [neck rigid, neck stiff, neck locked, head held rigid, head stays in line],
     pose: {neck_flex: [0, 0], neck_lat: [0, 0], neck_twist: [0, 0]}, layer: {tone: [0.5, 1.0]},
     check: {pred: range_of_motion, joint: neck_flex, max: [30, 8]}, src: bible}
  - {id: neck.limp, label: 'Neck limp, head lolls with gravity', region: neck,
     say: [neck limp, head lolls, head flops, head rolls loosely, loose neck, head dangles, head hangs],
     layer: {tone: [0.25, 0.03]}, check: {pred: tone, regions: [neck], max: [0.3, 0.08]}, src: bible}
  - {id: neck.head_off_mat, label: Head held up off the canvas while on her back, region: neck,
     say: [head off the mat, head held off, head raised off, head hovers, head lifted off],
     pose: {neck_flex: [0, 35]}, layer: {tone: [0.6, 1.0]},
     check: {pred: height, body: head, min: [0.10, 0.18]}, src: new}
  - {id: neck.whip, label: Head whips (snaps over then is thrown the other way) in the fall, region: neck,
     say: [head whip, whiplash, neck whip, head snaps back and forth],
     check: {pred: range_of_motion, joint: neck_flex, min: [20, 55], when: fall}, src: log}
  - {id: neck.snap_to_side, label: Head snaps to the side from the strike, region: neck,
     say: [head snap to the side, head snaps sideways, head jerks to the side, head spun],
     check: {pred: range_of_motion, joint: neck_twist, min: [15, 50], when: onset}, src: log}
  - {id: neck.snap_back_neutral, label: 'Head snaps back to where it was after a strike (sells the stiffness)', region: neck,
     say: [snap back to neutral, head snaps back, resets to the same position, reset close to the same position, back to neutral],
     layer: {tone: [0.7, 1.0]}, check: {pred: returns, regions: [neck], max: [20, 8]}, src: log}
  - {id: neck.slow_roll, label: Head slowly rolls to one side as tone fades, region: neck, side: LR,
     say: [head slowly roll, head drifts to, head settles to the side], src: new}
  - {id: neck.nod_bob, label: Head bobs/nods rhythmically (not tremor; slow 1-3 Hz), region: neck,
     say: [head bob, head nodding, head rocking],
     check: {pred: oscillation, regions: [neck], lo_hz: 1.0, hi_hz: 3.0, min: [0.5, 3.0]}, src: new}

  # ---- eyes ----
  - {id: eyes.gaze_up_corner, label: 'Gaze up and toward the upper corner, her frame (house default: 30% of pupil showing)', side: LR, default_side: L,
     say: [gaze up corner, eyes up and to the, looking up and to the, upper corner, eyes staring off upper, eyes rolled up and to the side],
     layer: {gaze: {up_deg: [15, 34], side_deg: [10, 24]}}, src: log}
  - {id: eyes.rolled_up, label: Eyes rolled straight up (bottom third of iris showing),
     say: [eyes rolled up, eyes roll back, eyes rolled back, bottom third],
     layer: {gaze: {up_deg: [15, 36], side_deg: [0, 0]}}, src: log}
  - {id: eyes.pupil_visible, label: Fraction of pupil/iris left visible (0.3 = house rule),
     say: [pupil visible, of the pupil, of pupils visible, can't see pupils, iris visible],
     layer: {gaze_visible: [0.6, 0.3]}, note: 'measured from an ID pass once the render gate exists', src: log}
  - {id: eyes.vacant_forward, label: 'Vacant stare straight ahead (flash KO, eyes unfocused)',
     say: [vacant stare, blank stare, thousand yard, staring through, glazed],
     layer: {gaze: {up_deg: [0, 6], side_deg: [0, 0]}}, src: bible}
  - {id: eyes.divergent, label: Eyes drift apart (each eye slightly off-axis),
     say: [eyes diverge, eyes drift apart, wall-eyed, unfocused eyes, eyes misaligned], src: new}
  - {id: eyes.drift, label: Slow wandering gaze (nystagmus-like slow drift and reset),
     say: [eyes drift, eyes wander, gaze wanders, eyes flick, eyes dart, nystagmus], src: new}
  - {id: eyes.lids_half, label: Eyelids half closed / heavy,
     say: [half closed, heavy lids, lids droop, eyes half open, hooded eyes], layer: {face: {lids_closed: [0.2, 0.6]}}, src: new}
  - {id: eyes.lids_wide, label: 'Eyes wide open, fixed',
     say: [eyes wide, wide eyed, eyes fixed open, eyes stuck open], layer: {face: {lids_wide: [0.2, 1.0]}}, src: new}
  - {id: eyes.lids_flutter, label: Eyelids flutter,
     say: [eyelids flutter, lids flutter, eyes flutter, blinking rapidly], layer: {face: {lid_flutter_hz: [4, 9]}}, src: new}
  - {id: eyes.closed, label: Eyes closed (overrides house rule of eyes open),
     say: [eyes closed, eyes shut], layer: {face: {lids_closed: [0.9, 1.0]}}, src: new}
  - {id: eyes.asym_lids, label: One lid lower than the other, side: LR,
     say: [one eye half closed, one lid lower, uneven eyelids, one eye more open], src: new}
  - {id: eyes.color, label: Eye colour more distinct and saturated (asset note),
     say: [eyes more distinct, saturated color, eye color], layer: {asset: eye_saturation}, src: log}

  # ---- mouth / jaw / brow ----
  - {id: face.jaw_slack, label: 'Jaw slack, mouth hangs slightly open (house default)',
     say: [jaw slack, mouth hangs open, mouth agape, slack jaw, mouth open, jaw drops],
     layer: {face: {jaw_open: [0.1, 0.6]}}, src: bible}
  - {id: face.teeth_clenched, label: 'Teeth clenched, jaw tight',
     say: [teeth clenched, jaw clenched, clenching, gritted teeth, biting down],
     layer: {face: {jaw_clench: [0.4, 1.0]}}, src: log}
  - {id: face.mouthguard, label: Mouthguard visible (asset),
     say: [mouthguard, mouth guard, gum shield], layer: {asset: mouthguard}, src: log}
  - {id: face.mouthguard_out, label: Mouthguard half out / hanging from the lips,
     say: [mouthguard hanging, mouthguard half out, mouthguard pops out, mouthguard flies], src: new}
  - {id: face.frown, label: Mouth corners down (no default smirk),
     say: [frown, mouth corners down, sad mouth, no smirk, no smile], layer: {face: {mouth_frown: [0.2, 0.8]}}, src: log}
  - {id: face.lips_parted, label: 'Lips parted, relaxed',
     say: [lips parted, lips apart], layer: {face: {jaw_open: [0.05, 0.25]}}, src: new}
  - {id: face.lips_pursed, label: Lips pressed/pursed with the tonic phase,
     say: [lips pursed, lips pressed, lips tight, grimace], layer: {face: {mouth_press: [0.3, 1.0]}}, src: new}
  - {id: face.cheek_puff, label: Cheeks puff with each breath out,
     say: [cheek puff, cheeks puff, puffing cheeks, blowing], layer: {face: {cheek_puff: [0.2, 0.8]}}, src: new}
  - {id: face.jaw_shift, label: Jaw pushed sideways at the strike then returns, side: LR,
     say: [jaw shifts, jaw pushed sideways, jaw slides], layer: {face: {jaw_side: [0.2, 0.8]}}, src: new}
  - {id: face.brow_raised, label: Brows raised (surprised blankness),
     say: [brows raised, eyebrows up, brow lifts], layer: {face: {brow_up: [0.2, 0.9]}}, src: new}
  - {id: face.brow_furrow, label: Brows knit with the tonic phase,
     say: [brow furrow, brows knit, brows pinch, scowl], layer: {face: {brow_down: [0.2, 0.9]}}, src: new}
  - {id: face.blank, label: Face fully blank and relaxed (no expression keys),
     say: [face blank, expressionless, face relaxed, no expression], layer: {face: {neutral: [1, 1]}}, src: bible}
  - {id: face.stylized_default, label: 'House face: jaw slack, slight frown, gaze up-corner, eyes open',
     say: [stylize facial expression, stylized face, facial expression as per, house face, usual face],
     expands: [{id: face.jaw_slack, i: 0.5}, {id: face.frown, i: 0.5}, {id: eyes.gaze_up_corner, i: 0.75}], src: log}
  - {id: face.cheek_on_canvas, label: Cheek pressed/slides on the canvas (prone finish),
     say: [face slides along the ground, cheek on the canvas, face pressed into the mat, face on the mat, face slide],
     check: {pred: contact_time, part: head, min: [0.3, 1.5]}, src: log}
  - {id: face.breath_mouth, label: Mouth opens and closes slightly with each breath,
     say: [mouth breathing, breathing through mouth, gasping], layer: {face: {breath_jaw: [0.1, 0.5]}}, src: new}

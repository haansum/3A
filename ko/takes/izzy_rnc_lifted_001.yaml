# Standing rear-naked choke, slightly lifted (owner 2026-11-18): once the hold is locked the
# whole hold rises 16 cm (6 and 12 cm left the toes loaded: she sinks in the hold and the tonic legs reach), so her toes come off the canvas; it comes down as the arms open.
character: izzy_leotard
arena: gym
archetype: rnc_seated
seed: 1
quality: draft
shots: [live]
render: {live_az: -60, live_dist: 2.6, live_z: 1.3, fps: 12, frame_step: 1, res: [480, 270], samples: 8}   # 12 fps preview (owner 2026-11-18)
overrides:
  arena: {rope_distance: 3.0, simulate_ropes: false}
  sim: {start: standing}
  grapple: {lift_m: 0.16, lift_s: 1.2, torso_delay: 0.6, lower_m: 0.65, lower_s: 1.2, release_soft: 0.4}
  # standing release (owner 2026-11-18: the fall looked inorganic: she stood on rigid tonic legs,
  # then jackknifed forward and curled up while the waking kicks fired mid-fall): he lowers her
  # 0.65 m over 1.2 s before opening his arms while her knees fold into a sit (sit_back), the
  # tonic drains in 0.4 s, his body stays behind her 0.6 s longer so she slumps back into it, and
  # she stays out 1.5 s after the release before coming round. (Dropping her without the lowering
  # put her on her knees and onto her face, hips up.)
  # tonic posture as a ratchet that pulses while it climbs (owner 2026-11-18): 10 irregular
  # notches over the 10 s to the release, tone pulsing at 2 Hz between notches
  controller:
    ko:
      phases:
        - {after: out, t: 0.0, rise: 0.1, hold: 9.9, fade: 0.4, regions: [arm_L, arm_R], tone: 0.9, zeta: 0.4, pose: arms_forward_bent, replace: true, depth: {start: 0.0, end: 1.0}, stagger: {arm_R: 0.12}, jitter: 0.06, shape: ratchet_pulse, shape_params: {steps: 10, step_dt: 1.0, step_rise: 0.18, pulse_hz: 2.0, pulse_amp: 0.35, pulse_depth: 0.15}}
        - {after: out, t: 0.0, rise: 0.1, hold: 9.9, fade: 0.4, regions: [leg_L, leg_R], tone: 0.6, zeta: 0.4, pose: extensor_legs, replace: true, depth: {start: 0.0, end: 1.0}, stagger: {leg_L: 0.15}, jitter: 0.06, shape: ratchet_pulse, shape_params: {steps: 10, step_dt: 1.0, step_rise: 0.18, pulse_hz: 2.0, pulse_amp: 0.35, pulse_depth: 0.15}}
        - {after: out, t: 0.2, rise: 0.8, hold: 20.0, fade: 1.0, regions: [neck], tone: 0.12, zeta: 0.6, pose: head_rolled_limp, replace: true, jitter: 0.05}
        - {after: release, t: 0.0, rise: 0.12, hold: 1.0, fade: 1.2, regions: [leg_L, leg_R], tone: 0.22, pose: sit_back, replace: true, stagger: {leg_R: 0.07}, jitter: 0.08}
        - {after: release, t: 0.0, rise: 0.1, hold: 1.5, fade: 1.0, regions: [trunk], tone: 0.08, pose: slump_forward, replace: true, jitter: 0.05}
    consciousness:
      wake: {decay: 0.15, floor: 0.35, delay: 1.5}

take: izzy_uppercut_spring_001
approved: true
approved_note: 'Owner rulings 2026-11-17: sides free unless stated; head turns with the follow-up; maximum shoulder
  roll and arm and leg extension after the follow-up.'
seed: 1
prose: 'An uppercut on the chin. She falls back with a springy collapse and ends on her back. When her head hits
  the canvas the body stiffens. The follow-up shot whips her head to the side and the tonic posture intensifies:
  tight fists, arms locked at different angles, upper back hunched, legs extended and pointed, ankles crossed, heels
  lifted.'

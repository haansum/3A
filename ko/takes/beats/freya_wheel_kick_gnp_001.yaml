take: freya_wheel_kick_gnp_001
approved: false
seed: 2
prose: I want a wheel kick that clips the jaw, leading to a teeter fall. The fighter's guard drops slightly and
  while hands are still up, as if in a loose guard, one arm extends slightly and the other starts contracting. wrists
  bend downwards. body slightly slumps forward as the body teeters backwards. when the head bounces off the ground
  the tonic posture intensifies, causing slight tremors, scissoring of the legs and shoulders rolling forward. a
  single followup shot while on the ground increases tonic posture intensity to max level, curling toes and crossing
  ankles. upper body tremors start. stylize facial expression as per pipeline doc.
